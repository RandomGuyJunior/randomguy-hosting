name: Install Material-Mapped Epic Bastion V16
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-epic-bastion-v16-uv.yml"
permissions:
  contents: write
jobs:
  uv-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Legion material-specific UV mapping
        run: |
          set -euo pipefail
          python3 tools/remap_epic_bastion_legion_uv.py
          echo "40ce081793a771304bdb7e19f6f1a4cb4fb409cdad5fa6a13c1e015841254321  objects3d/Units/legbastiont3.s3o" | sha256sum -c -
          python3 - <<'PY'
          import struct,re
          from pathlib import Path
          b=Path("objects3d/Units/legbastiont3.s3o").read_bytes()
          h=struct.unpack_from("<12sI5f4I",b)
          assert h[0].startswith(b"Spring unit")
          print("Epic Bastion V16: 691617-byte S3O with verified UV-only remap")
          PY
      - name: Commit exact UV-only S3O
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          if ! git diff --cached --quiet; then
            git commit -m "Apply material-aware Legion atlas UV mapping to Epic Bastion V16"
            git push origin HEAD:main
          fi
