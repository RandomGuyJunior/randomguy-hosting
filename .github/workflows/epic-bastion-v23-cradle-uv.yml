name: Deploy Epic Bastion V23 Cradle and UV
on:
  push:
    paths:
      - .github/workflows/epic-bastion-v23-cradle-uv.yml
      - tools/epic_bastion_v23_cradle_stock_uv.py
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/epic_bastion_v23_cradle_stock_uv.py
      - name: Apply verified changes
        run: |
          python3 tools/epic_bastion_v23_cradle_stock_uv.py --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          git diff --cached --quiet || (git commit -m "V23 remove outer cradle ring, restore Bastion inner UV and unify mount colors" && git push)
