name: Build Naval Advanced Fusion Models

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_naval_afus_models.py"
      - ".github/workflows/build-naval-afus-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build naval advanced fusion S3Os
        run: |
          python3 tools/build_naval_afus_models.py
          python3 tools/s3o_inspect.py objects3d/Units/armuwafus.s3o
          python3 tools/s3o_inspect.py objects3d/Units/coruwafus.s3o
          python3 tools/s3o_inspect.py objects3d/Units/leguwafus.s3o

      - name: Commit generated models
        run: |
          if git diff --quiet --             objects3d/Units/armuwafus.s3o             objects3d/Units/coruwafus.s3o             objects3d/Units/leguwafus.s3o; then
            echo "Models unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             objects3d/Units/armuwafus.s3o             objects3d/Units/coruwafus.s3o             objects3d/Units/leguwafus.s3o
          git commit -m "Build naval advanced fusion models"
          git pull --rebase origin main
          git push origin HEAD:main
