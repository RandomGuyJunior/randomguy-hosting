name: Epic Bastion V30 Correct Vertical Armor
on:
  push:
    paths:
      - .github/workflows/epic-bastion-v30-vertical-armor.yml
      - tools/epic_bastion_v30_vertical_armor_core_rollback.py
permissions:
  contents: write
jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate target faces and protected geometry
        run: python3 tools/epic_bastion_v30_vertical_armor_core_rollback.py
      - name: Commit corrected S3O
        run: |
          python3 tools/epic_bastion_v30_vertical_armor_core_rollback.py --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          git diff --cached --quiet || (git commit -m "V30 restore V27 central UV and remap tall cannon-support armor only" && git push)
