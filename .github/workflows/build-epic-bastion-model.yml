name: Rebuild Epic Bastion Model

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_epic_bastion_model.py"
      - ".github/workflows/build-epic-bastion-model.yml"

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild S3O
        run: |
          python3 tools/build_epic_bastion_model.py objects3d/Units/legbastiont3.s3o /tmp/legbastiont3.s3o
          mv /tmp/legbastiont3.s3o objects3d/Units/legbastiont3.s3o
          python3 tools/s3o_inspect.py objects3d/Units/legbastiont3.s3o

      - name: Commit rebuilt model
        run: |
          if git diff --quiet -- objects3d/Units/legbastiont3.s3o; then
            echo "Model unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          git commit -m "Revamp Epic Bastion model"
          git push origin HEAD:main
