name: Sync Team Color Widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosting repo
        uses: actions/checkout@v4

      - name: Download latest upstream widgets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LuaUI/Widgets

          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Armis71/BAR-Widgets-Public/main/gui_gridmenu_teamcolor.lua \
            -o LuaUI/Widgets/gui_gridmenu_teamcolor.lua

          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Armis71/BAR-Widgets-Public/main/gui_info_teamcolor.lua \
            -o LuaUI/Widgets/gui_info_teamcolor.lua

          grep -F 'name = "Grid menu (Team Color)"' LuaUI/Widgets/gui_gridmenu_teamcolor.lua
          grep -F 'name = "Info (Team Color)"' LuaUI/Widgets/gui_info_teamcolor.lua

      - name: Commit upstream changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- LuaUI/Widgets/gui_gridmenu_teamcolor.lua LuaUI/Widgets/gui_info_teamcolor.lua; then
            echo "Team-color widgets already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LuaUI/Widgets/gui_gridmenu_teamcolor.lua LuaUI/Widgets/gui_info_teamcolor.lua
          git commit -m "Sync Armis71 team-color widgets"
          git push
