name: Epic Bastion V27 Flat Turretbase Ring
on:
  push:
    paths:
      - ".github/workflows/epic-bastion-v27.yml"
      - "tools/epic_bastion_v27_flat_turretbase_ring.py"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate geometry and UV preservation
        run: python3 tools/epic_bastion_v27_flat_turretbase_ring.py
      - name: Commit tested V27 S3O
        run: |
          python3 tools/epic_bastion_v27_flat_turretbase_ring.py --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          git diff --cached --quiet || (git commit -m "V27 flatten turretbase ring, remove pillars, gray cannon rear armor" && git push)
