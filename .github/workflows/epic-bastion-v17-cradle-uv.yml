name: Epic Bastion V17 Cradle UV
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/epic-bastion-v17-cradle-uv.yml"
      - "tools/epic_bastion_v17_cradle_ring_uv.py"
permissions:
  contents: write
jobs:
  uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map original Legion atlas onto cradle and optical ring
        run: |
          python3 tools/epic_bastion_v17_cradle_ring_uv.py
          python3 tools/s3o_inspect.py objects3d/Units/legbastiont3.s3o
      - name: Commit model UVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remap Legion cradle and fifth ring using pixel-verified atlas surfaces"
          git push origin HEAD:main
