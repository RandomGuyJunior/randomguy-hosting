name: Audit Original Legion Bastion UVs
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/audit_epic_legion_uv.py"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare original and Epic S3O UVs
        run: python3 tools/audit_epic_legion_uv.py
