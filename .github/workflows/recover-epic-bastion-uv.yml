name: Recover Original Epic Bastion UVs
on:
  push:
    paths:
      - ".github/workflows/recover-epic-bastion-uv.yml"
      - "tools/restore_epic_bastion_original_uv.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Analyze exact original geometry UV matches
        run: python3 tools/restore_epic_bastion_original_uv.py
      - name: Restore original UVs without changing geometry
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 tools/restore_epic_bastion_original_uv.py --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add objects3d/Units/legbastiont3.s3o
          git diff --cached --quiet || (git commit -m "Restore geometry-matched original Epic Bastion UVs" && git push)
